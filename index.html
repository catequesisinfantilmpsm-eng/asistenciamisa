ue));border-radius:20px;padding:18px;text-align:left;box-shadow:var(--shadow);cursor:pointer;color:var(--ink);transition:transform .18s,box-shadow .18s}.course:nth-child(4n+1),.group:nth-child(4n+1){--accent:var(--yellow)}.course:nth-child(4n+2),.group:nth-child(4n+2){--accent:var(--red)}.course:nth-child(4n+3),.group:nth-child(4n+3){--accent:var(--blue)}.course:nth-child(4n),.group:nth-child(4n){--accent:var(--black)}.course:hover,.group:hover{transform:translateY(-3px);box-shadow:0 16px 35px #0002}.icon{font-size:35px}.course h2,.group h3{margin:9px 0 4px}.course p,.group p{margin:0;color:var(--muted);font-size:13px}.course.alert{--accent:var(--red)}.course.alert h2{color:var(--red)}.course.catechists{--accent:var(--blue)}.box{padding:16px}.tools{display:flex;gap:10px;margin-bottom:14px}.tools input{flex:1;min-width:0;height:46px;border:2px solid #ccd4df;border-radius:12px;padding:0 13px;font:inherit;font-size:16px}.tools input:focus{outline:3px solid #1559a629;border-color:var(--blue)}.kid{background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:18px;padding:15px;box-shadow:0 7px 20px #00000012;margin-bottom:12px}.kidtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-size:17px;font-weight:850}.meta{font-size:12px;color:var(--muted);margin-top:3px}.count{min-width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900}.count.bad{background:var(--red)}.path{display:flex;gap:5px;align-items:center;overflow:auto;padding:15px 1px 5px}.step{flex:0 0 auto;text-align:center}.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#e5e7eb;color:#606873;font-weight:900;font-size:12px}.dot.ok{background:var(--blue);color:#fff}.line{width:15px;height:3px;background:#dfe3ea}.date{font-size:9px;color:var(--muted);margin-top:4px}.family{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:fl </style></head><body><header class="hero"><div class="heroin"><div class="brand"><div class="logo"><img src="senor-misericordia.png" alt="Señor de la Misericordia"></div><div><h1>Asistencia a Misa CATEKIDS</h1><p class="sub">Ciclo 2026–2027</p></div></div></div></header><main class="page">
<section id="loading" class="box loading"><div class="spinner"></div><strong>Cargando registros…</strong></section><section id="error" class="box empty hidden"><div class="error" id="errorText"></div><button class="pdf" style="margin-top:14px" onclick="loadData()">Volver a intentar</button></section>
<section id="app" class="hidden"><div class="bar"><button id="back" class="back hidden">← Regresar</button><div id="crumb" class="crumb">Selecciona un curso</div><button id="print" class="pdf hidden" onclick="printCurrent()">Imprimir / PDF</button></div><div id="view"></div><p id="updated" class="updated"></p></section></main>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbyrIwSyWwVHy1rIyhGtXqA3zFh9Yc-SI0Yoz_Yfbr7v5wuKOUSZ6sV4E3HED5jom1Bh/exec";let DATA=null,CURRENT=null,ALERTS=[],CATECHISTS=[],REFRESH=null,GROUP_CACHE={},state={screen:"courses",stage:"",sheet:"",origin:"courses",catechist:""};const $=id=>document.getElementById(id),norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim(),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function jsonp(params={}){return new Promise((resolve,reject)=>{if(API_URL.startsWith("PEGAR_"))return reject(new Error("Falta colocar la dirección /exec de Apps Script en index.html."));const cb="ck"+Date.now()+Math.random().toString(36).slice(2),s=document.createElement("script"),t=setTimeout(()=>done(new Error("La consulta sigue procesándose. Pulsa Volver a intentar; las siguientes consultas serán más rápidas.")),60000);function done(e,v){clearTimeout(t);delete window[cb];s.remove();e?reject(e):resolve(v)}window[cb]=v=>done(null,v);s.onerror=()=>done(new Error("No fue posible conectar con Apps Script."));s.src=API_URL+"?"+new URLSearchParams({...params,callback:cb,t:Date.now()});document.body.appendChild(s)})}
async function loadData(){$("loading").classList.remove("hidden");$("error").classList.add("hidden");$("app").classList.add("hidden");try{const r=await jsonp();if(!r.ok)throw new Error(r.error||"No fue posible leer las asistencias.");DATA=r;$("loading").classList.add("hidden");$("app").classList.remove("hidden");$("updated").textContent="Actualizado: "+r.updated;showCourses()}catch(e){$("loading").classList.add("hidden");$("errorText").textContent=e.message;$("error").classList.remove("hidden")}}
function stageKey(s){const n=norm(s);if(n.includes("inici"))return"INICIACIÓN";if(n.includes("confirm"))return"CONFIRMACIÓN";if(n.includes("comuni"))return"COMUNIÓN";if(n.includes("persev"))return"PERSEVERANTES";return String(s||"CATEKIDS").toUpperCase()}
function stages(){const order=["INICIACIÓN","CONFIRMACIÓN","COMUNIÓN","PERSEVERANTES"],map={};DATA.groups.forEach(g=>{const k=stageKey(g.stage);(map[k]??=[]).push(g)});return order.filter(k=>map[k]).map(k=>({name:k,groups:map[k]}))}
function setBar(title,back,print){$("crumb").textContent=title;$("back").classList.toggle("hidden",!back);$("print").classList.toggle("hidden",!print)}
function stopRefresh(){if(REFRESH){clearInterval(REFRESH);REFRESH=null}}
function showCourses(){stopRefresh();state={screen:"courses",stage:"",sheet:"",origin:"courses",catechist:""};setBar("Selecciona una consulta",false,false);const icons={"INICIACIÓN":"🌱","CONFIRMACIÓN":"🕊️","COMUNIÓN":"🍞","PERSEVERANTES":"⭐"};$("view").innerHTML=`<div class="grid">${stages().map(s=>`<button class="course" onclick='showGroups(${JSON.stringify(s.name)})'><div class="icon">${icons[s.name]||"📖"}</div><h2>${s.name}</h2><p>${s.groups.length} grupos · ${s.groups.reduce((n,g)=>n+g.childrenCount,0)} niños</p></button>`).join("")}<button class="course catechists" onclick="showCatechists()"><div class="icon">👩‍🏫</div><h2>Catequistas</h2><p>Consultar su asistencia personal a Misa</p></button><button class="course alert" onclick="showAlerts()"><div class="icon">⚠️</div><h2>3 o más faltas</h2><p>Seguimiento separado por grupo</p></button></div>`}
function groupButton(g,origin){return `<button class="group" onclick='showGroup(${JSON.stringify(g.sheet)},false,${JSON.stringify(origin)})'><div class="icon">📋</div><h3>${esc(g.group||g.sheet)}</h3><p>${esc(stageKey(g.stage))} · ${g.childrenCount} niños</p><div style="display:inline-block;margin-top:10px;padding:6px 10px;border-radius:999px;background:#e9f1fb;color:#1559a6;font-weight:900">Ver asistencia</div></button>`}
function showGroups(stage){stopRefresh();state={screen:"groups",stage,sheet:"",origin:"groups",catechist:""};setBar(stage,true,false);const gs=DATA.groups.filter(g=>stageKey(g.stage)===stage);$("view").innerHTML=`<div class="grid">${gs.map(g=>`<button class="group" onclick='showGroup(${JSON.stringify(g.sheet)},false,"groups")'><div class="icon">👩‍🏫</div><h3>${esc(g.catechist||g.sheet)}</h3><p>${esc(g.group||g.sheet)} · ${g.childrenCount} niños</p><div style="display:inline-block;margin-top:10px;padding:6px 10px;border-radius:999px;background:#e9f1fb;color:#1559a6;font-weight:900">Ver asistencia</div></button>`).join("")}</div>`}
async function showCatechists(){stopRefresh();state={screen:"catechists",stage:"",sheet:"",origin:"courses",catechist:""};setBar("Asistencia a Misa · Catequistas",true,false);$("view").innerHTML='<div class="box loading"><div class="spinner"></div>Consultando asistencia de catequistas…</div>';try{const r=await jsonp({action:"catechists"});if(!r.ok)throw new Error(r.error);CATECHISTS=r.catechists||[];setBar("Asistencia a Misa · Catequistas",true,true);$("view").innerHTML='<div class="tools"><input id="search" type="search" placeholder="Buscar catequista o código" oninput="renderCatechists()"></div><div id="catechistList"></div>';renderCatechists()}catch(e){$("view").innerHTML=`<div class="box empty error">${esc(e.message)}</div>`}}
function renderCatechists(){const q=norm($("search")?.value),found=CATECHISTS.filter(c=>!q||norm(c.name+" "+c.code).includes(q));$("catechistList").innerHTML=found.length?found.map((c,i)=>`<article class="kid"><div class="kidtop"><div><div class="name">${i+1}. ${esc(c.name)}</div><div class="meta">${esc(c.code||"Sin código")} · ${c.attended} misas · ${c.absences} faltas · ${c.holyHours||0} Hora Santa</div></div><div class="count ${c.absences>=3?"bad":""}" title="Asistencias a Misa">${c.attended}</div></div><div class="path">${path(c)}</div></article>`).join(""):'<div class="box empty">No se encontraron catequistas.</div>'}
async function loadPercentages(groups){for(const g of groups){if(!["groups","catechist"].includes(state.screen))break;try{const r=GROUP_CACHE[g.sheet]||await jsonp({action:"group",sheet:g.sheet});if(!r.ok)continue;GROUP_CACHE[g.sheet]=r;const el=$("pct-"+safeId(g.sheet));if(el){const p=r.group.attendancePercent;el.textContent=p+"% asistencia";el.style.background=p>=90?"#dbeafe":p>=70?"#fff0b8":"#ffd9dc";el.style.color=p>=70?"#1559a6":"#cf202f"}}catch(_){}}}
function safeId(s){return String(s).replace(/[^a-zA-Z0-9_-]/g,"_")}
async function showGroup(sheet,silent=false,origin="groups"){const meta=DATA.groups.find(x=>x.sheet===sheet),previous=state;if(!meta)return;state={screen:"group",stage:stageKey(meta.stage),sheet,origin:silent?(previous.origin||origin):origin,catechist:silent?(previous.catechist||meta.catechist||""):(meta.catechist||"")};if(!silent){setBar(`${meta.group||meta.sheet} · ${meta.catechist||"Catequista"}`,true,false);$("view").innerHTML='<div class="box loading"><div class="spinner"></div>Consultando este grupo…</div>'}try{const r=await jsonp({action:"group",sheet});if(!r.ok)throw new Error(r.error);CURRENT=r.group;GROUP_CACHE[sheet]=r;setBar(`${CURRENT.group||CURRENT.sheet} · ${CURRENT.catechist||"Catequista"} · ${CURRENT.attendancePercent}%`,true,true);if(!silent)$("view").innerHTML=`<div class="tools"><input id="search" type="search" placeholder="Buscar niño o código" oninput="renderKids()"></div><div id="kids"></div>`;renderKids();stopRefresh();REFRESH=setInterval(()=>{if(state.screen==="group"&&state.sheet===sheet)showGroup(sheet,true,state.origin)},15000)}catch(e){if(!silent)$("view").innerHTML=`<div class="box empty error">${esc(e.message)}</div>`}}
function renderKids(){const g=CURRENT,q=norm($("search")?.value),kids=g.children.filter(c=>!q||norm(c.name+" "+c.code).includes(q));$("kids").innerHTML=kids.length?kids.map((c,i)=>kidCard(c,g,i+1,false)).join(""):'<div class="box empty">No se encontraron niños.</div>'}
function path(c){return c.attendance.map((x,i)=>`<div class="step"><div class="dot ${x.type==="hora_santa"?"holy":x.attended?"ok":""}">${x.attended?"✓":"—"}</div><div class="date">${esc(x.label)}</div></div>${i<c.attendance.length-1?'<div class="line"></div>':''}`).join("")||'<span class="meta">Todavía no hay registros.</span>'}
function kidCard(c,g,n,alert){const msg=`Hola, ${c.tutor||"familia"}. Somos de CATEKIDS de la Misión Parroquial El Señor de la Misericordia. Queremos acompañarles porque ${c.name} registra ${c.absences} inasistencias a Misa. ¿Podrían comunicarnos si existe alguna situación en la que podamos apoyarles? Dios les bendiga.`;const family=alert?`<div class="family"><span><strong>Tutor:</strong> ${esc(c.tutor||"No registrado")}</span>${c.whatsapp?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${esc(c.whatsapp)}?text=${encodeURIComponent(msg)}">WhatsApp</a>`:'<span>Sin teléfono</span>'}<button class="report" onclick='printIndividual(${JSON.stringify(g.sheet)},${JSON.stringify(c.code)},${JSON.stringify(c.name)})'>Reporte individual</button></div>`:"";return `<article class="kid"><div class="kidtop"><div><div class="name">${n}. ${esc(c.name)}</div><div class="meta">${esc(c.code||"Sin código")} · ${esc(g.group||g.sheet)} · ${esc(g.catechist||"")} · Hora Santa: ${c.holyHours||0}</div></div><div class="count ${alert?"bad":""}">${alert?c.absences:c.attended}</div></div><div class="path">${path(c)}</div>${family}</article>`}
function showAlerts(){stopRefresh();state={screen:"alertLevels",stage:"",sheet:"",origin:"courses",catechist:""};setBar("3 o más faltas · Selecciona nivel",true,false);const icons={"INICIACIÓN":"🌱","CONFIRMACIÓN":"🕊️","COMUNIÓN":"🍞","PERSEVERANTES":"⭐"};$("view").innerHTML=`<div class="grid">${stages().map(s=>`<button class="course alert" onclick='showAlertStage(${JSON.stringify(s.name)})'><div class="icon">${icons[s.name]||"📖"}</div><h2>${s.name}</h2><p>${s.groups.length} grupos</p></button>`).join("")}</div>`}
function showAlertStage(stage){stopRefresh();state={screen:"alertCatechists",stage,sheet:"",origin:"alerts",catechist:""};setBar(`3 o más faltas · ${stage} · Catequista`,true,false);const map=new Map();DATA.groups.filter(g=>stageKey(g.stage)===stage).forEach(g=>{const name=String(g.catechist||g.sheet).trim();if(!map.has(name))map.set(name,[]);map.get(name).push(g)});$("view").innerHTML=`<div class="grid">${[...map.entries()].map(([name,gs])=>`<button class="group" onclick='loadAlertCatechist(${JSON.stringify(stage)},${JSON.stringify(name)},${JSON.stringify(gs.map(g=>g.sheet))})'><div class="icon">👩‍🏫</div><h3>${esc(name)}</h3><p>${gs.reduce((n,g)=>n+g.childrenCount,0)} niños · Ver faltantes</p></button>`).join("")}</div>`}
async function loadAlertCatechist(stage,catechist,sheets){stopRefresh();state={screen:"alertResults",stage,sheet:"",origin:"alerts",catechist};setBar(`3 o más faltas · ${catechist}`,true,false);$("view").innerHTML='<div class="box loading"><div class="spinner"></div>Consultando solamente este grupo…</div>';try{const r=await jsonp({action:"alerts",sheets:sheets.join("|")});if(!r.ok)throw new Error(r.error);ALERTS=r.alerts||[];setBar(`3 o más faltas · ${catechist}`,true,true);$("view").innerHTML='<div class="tools"><input id="search" type="search" placeholder="Buscar niño o tutor" oninput="renderAlerts()"></div><div id="kids"></div>';renderAlerts()}catch(e){$("view").innerHTML=`<div class="box empty error">${esc(e.message)}</div>`}}
function renderAlerts(){const q=norm($("search")?.value),found=ALERTS.filter(x=>!q||norm(x.child.name+" "+x.child.tutor+" "+x.catechist+" "+x.stage+" "+x.group+" "+x.sheet).includes(q));if(!found.length){$("kids").innerHTML='<div class="box empty">No hay niños con 3 o más faltas.</div>';return}const grouped=new Map();found.forEach(x=>{const key=x.sheet||x.group||"Sin grupo";if(!grouped.has(key))grouped.set(key,{meta:x,items:[]});grouped.get(key).items.push(x)});$("kids").innerHTML=[...grouped.values()].sort((a,b)=>String(a.meta.group||a.meta.sheet).localeCompare(String(b.meta.group||b.meta.sheet),"es")).map(({meta,items})=>`<section class="alert-group"><div class="alert-group-head"><div><h2>${esc(meta.group||meta.sheet)}</h2><p>${esc(stageKey(meta.stage))} · Catequista: ${esc(meta.catechist||"No registrado")}</p></div><span class="badge">${items.length} ${items.length===1?"niño":"niños"}</span></div>${items.map((x,i)=>kidCard(x.child,x,i+1,true)).join("")}</section>`).join("")}
function printCurrent(){if(state.screen==="group"&&CURRENT)return printGroupTable();window.print()}
function printGroupTable(){const g=CURRENT,w=window.open("","_blank","width=1200,height=850");if(!w)return alert("Permite las ventanas emergentes para imprimir la lista.");const headers=g.schedule.map(x=>`<th class="${x.type==="hora_santa"?"holy":""}">${esc(x.label.replace(" · Hora Santa"," HS"))}</th>`).join("");const rows=g.children.map((c,i)=>`<tr><td>${i+1}</td><td class="person">${esc(c.name)}</td><td class="code">${esc(c.code||"")}</td>${c.attendance.map(x=>`<td class="mark ${x.type==="hora_santa"?"holy":""}">${x.attended?"✓":"—"}</td>`).join("")}<td class="total">${c.attended}</td><td class="miss">${c.absences}</td></tr>`).join("");w.document.write(`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>${esc(g.group||g.sheet)} · Asistencia</title><style>@page{size:landscape;margin:5mm}*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;color:#111;font-size:7.5px}h1{font-size:15px;margin:0 0 2px}.info{font-size:9px;margin:0 0 5px}.legend{margin:4px 0;font-size:8px}.yellow{display:inline-block;background:#f4c430;padding:2px 5px;font-weight:bold}table{border-collapse:collapse;width:100%;table-layout:fixed}th,td{border:1px solid #333;padding:2px;text-align:center;height:18px;overflow:hidden}th{background:#1559a6;color:#fff;font-size:6.5px;line-height:1.05;word-break:break-word}.holy{background:#f4c430!important;color:#111!important}.person{text-align:left;font-weight:bold;width:165px}.code{text-align:left;width:120px;font-size:6.5px}.mark{font-size:10px}.total{background:#dbeafe;font-weight:bold}.miss{background:#ffe0e3;font-weight:bold}button{margin-top:8px;padding:6px 12px}@media print{button{display:none}body{print-color-adjust:exact;-webkit-print-color-adjust:exact}}</style></head><body><h1>CATEKIDS · Asistencia a Misa</h1><p class="info"><b>Grupo:</b> ${esc(g.group||g.sheet)} &nbsp; <b>Catequista:</b> ${esc(g.catechist||"")} &nbsp; <b>Porcentaje:</b> ${g.attendancePercent}%</p><div class="legend"><span class="yellow">HS = Hora Santa</span> Solo es referencia; no suma asistencia ni falta de Misa.</div><table><thead><tr><th style="width:24px">No.</th><th class="person">Nombre</th><th class="code">Código</th>${headers}<th style="width:30px">Misas</th><th style="width:30px">Faltas</th></tr></thead><tbody>${rows}</tbody></table><button onclick="window.print()">Imprimir / Guardar PDF</button></body></html>`);w.document.close();setTimeout(()=>w.print(),350)}
function printIndividual(sheet,code,name){const item=ALERTS.find(x=>x.sheet===sheet&&((code&&x.child.code===code)||x.child.name===name)),g=item,c=item.child,w=window.open("","_blank","width=800,height=900");if(!w)return alert("Permite las ventanas emergentes para crear el reporte.");const dates=c.attendance.map(x=>`<tr><td>${esc(x.label)}</td><td>${x.type==="hora_santa"?"HORA SANTA · ":""}${x.attended?"ASISTIÓ":"FALTA"}</td></tr>`).join("");w.document.write(`<!doctype html><html><head><title>Reporte ${esc(c.name)}</title><style>body{font-family:Arial;padding:28px;color:#173126}h1{color:#075b36}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{border:1px solid #ccc;padding:9px}.bad{color:#b3261e;font-weight:bold}@media print{button{display:none}}</style></head><body><h1>Reporte individual CATEKIDS</h1><p><b>Niño:</b> ${esc(c.name)}<br><b>Grupo:</b> ${esc(g.group||g.sheet)}<br><b>Catequista:</b> ${esc(g.catechist||"")}<br><b>Tutor:</b> ${esc(c.tutor||"No registrado")}<br><b>WhatsApp:</b> ${esc(c.whatsapp||"No registrado")}<br><b>Faltas:</b> <span class="bad">${c.absences}</span></p><table><tr><th>Fecha</th><th>Estado</th></tr>${dates}</table><p>La Hora Santa es solo referencia y no cuenta como asistencia ni falta de Misa.</p><p>Observaciones: ______________________________________________________________</p><button onclick="window.print()">Imprimir / Guardar PDF</button></body></html>`);w.document.close()}
$("back").onclick=()=>{if(state.screen==="group")showGroups(state.stage);else if(state.screen==="alertResults")showAlertStage(state.stage);else if(state.screen==="alertCatechists")showAlerts();else showCourses()};loadData();
</script></body></html>
