<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075b36"><title>CATEKIDS · Asistencia</title><style>
:root{--g:#075b36;--g2:#0b8250;--red:#b3261e;--gold:#efb72d;--ink:#173126;--muted:#687a70;--line:#dce8e0;--shadow:0 12px 30px #075b361c}*{box-sizing:border-box}body{margin:0;background:#f2f7f3;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.hero{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 46px;border-radius:0 0 28px 28px}.heroin,.page{max-width:1050px;margin:auto}.brand{display:flex;gap:13px;align-items:center}.logo{width:54px;height:54px;border-radius:17px;background:#fff;color:var(--g);display:grid;place-items:center;font-size:29px}h1{font-size:clamp(23px,5vw,36px);line-height:1.05;margin:0}.sub{margin:6px 0 0;color:#def3e6}.page{padding:0 14px 35px;margin-top:-27px}.bar,.box{background:#fff;border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow)}.bar{padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}.back,.pdf,.wa,.report{border:0;border-radius:11px;padding:10px 13px;font:inherit;font-weight:800;cursor:pointer}.back{background:#edf6f0;color:var(--g)}.pdf{background:var(--g);color:#fff}.crumb{font-weight:800;text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}.course,.group{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;text-align:left;box-shadow:var(--shadow);cursor:pointer;color:var(--ink)}.course:hover,.group:hover{transform:translateY(-2px)}.icon{font-size:35px}.course h2,.group h3{margin:9px 0 4px}.course p,.group p{margin:0;color:var(--muted);font-size:13px}.course.alert{border:2px solid #e2a09b}.course.alert h2{color:var(--red)}.box{padding:16px}.tools{display:flex;gap:10px;margin-bottom:14px}.tools input{flex:1;min-width:0;height:46px;border:1px solid #bcd0c3;border-radius:12px;padding:0 13px;font:inherit;font-size:16px}.kid{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 7px 20px #075b3612;margin-bottom:12px}.kidtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-size:17px;font-weight:850}.meta{font-size:12px;color:var(--muted);margin-top:3px}.count{min-width:46px;height:46px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:900}.count.bad{background:var(--red)}.path{display:flex;gap:5px;align-items:center;overflow:auto;padding:15px 1px 5px}.step{flex:0 0 auto;text-align:center}.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#dfe6e2;color:#6e7a73;font-weight:900;font-size:12px}.dot.ok{background:#39a961;color:#fff}.line{width:15px;height:3px;background:#dfe6e2}.date{font-size:9px;color:var(--muted);margin-top:4px}.family{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}.family span{margin-right:auto}.wa{background:#1f9d55;color:#fff;text-decoration:none;font-size:13px}.report{background:#fff1cf;color:#654900;font-size:13px}.empty,.loading{text-align:center;padding:35px;color:var(--muted)}.spinner{width:38px;height:38px;margin:0 auto 12px;border:4px solid #dbe8e0;border-top-color:var(--g);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.hidden{display:none!important}.error{color:var(--red);font-weight:800}.updated{text-align:center;color:var(--muted);font-size:11px;margin-top:14px}
@media(max-width:560px){.hero{padding-bottom:40px}.page{padding:0 10px 28px}.grid{grid-template-columns:1fr 1fr;gap:10px}.course,.group{padding:14px}.course h2{font-size:17px}.bar{align-items:stretch;flex-wrap:wrap}.crumb{order:-1;width:100%}.bar button{flex:1}.tools{flex-direction:column}.pdf{width:100%}.kid{padding:13px}.dot{width:25px;height:25px}.line{width:11px}.mode-title{font-size:20px}}
@media print{body{background:#fff}.hero{padding:10px;border-radius:0}.page{margin:0;padding:8px;max-width:none}.bar,.tools,.family .wa,.family .report,.updated{display:none!important}.kid{box-shadow:none;break-inside:avoid}.grid{display:block}.course,.group{box-shadow:none;margin-bottom:8px}}
</style></head><body><header class="hero"><div class="heroin"><div class="brand"><div class="logo">✝</div><div><h1>Asistencia a Misa CATEKIDS</h1><p class="sub">Ciclo 2026–2027</p></div></div></div></header><main class="page">
<section id="loading" class="box loading"><div class="spinner"></div><strong>Cargando registros…</strong></section><section id="error" class="box empty hidden"><div class="error" id="errorText"></div><button class="pdf" style="margin-top:14px" onclick="loadData()">Volver a intentar</button></section>
<section id="app" class="hidden"><div class="bar"><button id="back" class="back hidden">← Regresar</button><div id="crumb" class="crumb">Selecciona un curso</div><button id="print" class="pdf hidden" onclick="window.print()">Imprimir / PDF</button></div><div id="view"></div><p id="updated" class="updated"></p></section></main>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbzTL_g7zQnbTCbjZguZCVc2GiF-F-fF3qx6WeEO1unF1boyeJJPNj1CqG0zUG8UzK6-/exec";let DATA=null,state={screen:"courses",stage:"",sheet:""};const $=id=>document.getElementById(id),norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim(),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function jsonp(){return new Promise((resolve,reject)=>{if(API_URL.startsWith("PEGAR_"))return reject(new Error("Falta colocar la dirección /exec de Apps Script en index.html."));const cb="ck"+Date.now()+Math.random().toString(36).slice(2),s=document.createElement("script"),t=setTimeout(()=>done(new Error("La conexión tardó demasiado. Revisa la implementación de Apps Script.")),45000);function done(e,v){clearTimeout(t);delete window[cb];s.remove();e?reject(e):resolve(v)}window[cb]=v=>done(null,v);s.onerror=()=>done(new Error("No fue posible conectar con Apps Script."));s.src=API_URL+"?callback="+cb+"&t="+Date.now();document.body.appendChild(s)})}
async function loadData(){$("loading").classList.remove("hidden");$("error").classList.add("hidden");$("app").classList.add("hidden");try{const r=await jsonp();if(!r.ok)throw new Error(r.error||"No fue posible leer las asistencias.");DATA=r;$("loading").classList.add("hidden");$("app").classList.remove("hidden");$("updated").textContent="Actualizado: "+r.updated;showCourses()}catch(e){$("loading").classList.add("hidden");$("errorText").textContent=e.message;$("error").classList.remove("hidden")}}
function stageKey(s){const n=norm(s);if(n.includes("inici"))return"INICIACIÓN";if(n.includes("confirm"))return"CONFIRMACIÓN";if(n.includes("comuni"))return"COMUNIÓN";if(n.includes("persev"))return"PERSEVERANTES";return String(s||"CATEKIDS").toUpperCase()}
function stages(){const order=["INICIACIÓN","CONFIRMACIÓN","COMUNIÓN","PERSEVERANTES"],map={};DATA.groups.forEach(g=>{const k=stageKey(g.stage);(map[k]??=[]).push(g)});return order.filter(k=>map[k]).map(k=>({name:k,groups:map[k]}))}
function setBar(title,back,print){$("crumb").textContent=title;$("back").classList.toggle("hidden",!back);$("print").classList.toggle("hidden",!print)}
function showCourses(){state={screen:"courses",stage:"",sheet:""};setBar("Selecciona un curso",false,false);const alertCount=DATA.groups.flatMap(g=>g.children).filter(c=>c.absences>=3).length;const icons={"INICIACIÓN":"🌱","CONFIRMACIÓN":"🕊️","COMUNIÓN":"🍞","PERSEVERANTES":"⭐"};$("view").innerHTML=`<div class="grid">${stages().map(s=>`<button class="course" onclick='showGroups(${JSON.stringify(s.name)})'><div class="icon">${icons[s.name]||"📖"}</div><h2>${s.name}</h2><p>${s.groups.length} grupos · ${s.groups.reduce((n,g)=>n+g.children.length,0)} niños</p></button>`).join("")}<button class="course alert" onclick="showAlerts()"><div class="icon">⚠️</div><h2>3 o más faltas</h2><p>${alertCount} niños requieren seguimiento</p></button></div>`}
function showGroups(stage){state={screen:"groups",stage,sheet:""};setBar(stage,true,false);const gs=DATA.groups.filter(g=>stageKey(g.stage)===stage);$("view").innerHTML=`<div class="grid">${gs.map(g=>`<button class="group" onclick='showGroup(${JSON.stringify(g.sheet)})'><div class="icon">👩‍🏫</div><h3>${esc(g.catechist||g.sheet)}</h3><p>${esc(g.group||g.sheet)} · ${g.children.length} niños</p></button>`).join("")}</div>`}
function showGroup(sheet){const g=DATA.groups.find(x=>x.sheet===sheet);state={screen:"group",stage:stageKey(g.stage),sheet};setBar(`${g.group||g.sheet} · ${g.catechist||"Catequista"}`,true,true);$("view").innerHTML=`<div class="tools"><input id="search" type="search" placeholder="Buscar niño o código" oninput="renderKids()"></div><div id="kids"></div>`;renderKids()}
function renderKids(){const g=DATA.groups.find(x=>x.sheet===state.sheet),q=norm($("search")?.value),kids=g.children.filter(c=>!q||norm(c.name+" "+c.code).includes(q));$("kids").innerHTML=kids.length?kids.map((c,i)=>kidCard(c,g,i+1,false)).join(""):'<div class="box empty">No se encontraron niños.</div>'}
function path(c){const present=new Set(c.dates.filter(d=>d.type==="weekend"||d.type==="solemn").map(d=>d.date));return DATA.massDates.map((d,i)=>`<div class="step"><div class="dot ${present.has(d)?"ok":""}">${present.has(d)?"✓":"—"}</div><div class="date">${d.slice(0,5)}</div></div>${i<DATA.massDates.length-1?'<div class="line"></div>':''}`).join("")||'<span class="meta">Todavía no hay fechas de misa registradas.</span>'}
function kidCard(c,g,n,alert){const msg=`Hola, ${c.tutor||"familia"}. Somos de CATEKIDS de la Misión Parroquial El Señor de la Misericordia. Queremos acompañarles porque ${c.name} registra ${c.absences} inasistencias a Misa. ¿Podrían comunicarnos si existe alguna situación en la que podamos apoyarles? Dios les bendiga.`;const family=alert?`<div class="family"><span><strong>Tutor:</strong> ${esc(c.tutor||"No registrado")}</span>${c.whatsapp?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${esc(c.whatsapp)}?text=${encodeURIComponent(msg)}">WhatsApp</a>`:'<span>Sin teléfono</span>'}<button class="report" onclick='printIndividual(${JSON.stringify(g.sheet)},${JSON.stringify(c.code)},${JSON.stringify(c.name)})'>Reporte individual</button></div>`:"";return `<article class="kid"><div class="kidtop"><div><div class="name">${n}. ${esc(c.name)}</div><div class="meta">${esc(c.code||"Sin código")} · ${esc(g.group||g.sheet)} · ${esc(g.catechist||"")}</div></div><div class="count ${alert?"bad":""}">${alert?c.absences:c.dates.length}</div></div><div class="path">${path(c)}</div>${family}</article>`}
function showAlerts(){state={screen:"alerts",stage:"",sheet:""};setBar("Niños con 3 o más faltas",true,true);$("view").innerHTML='<div class="tools"><input id="search" type="search" placeholder="Buscar niño, tutor, curso o catequista" oninput="renderAlerts()"></div><div id="kids"></div>';renderAlerts()}
function renderAlerts(){const q=norm($("search")?.value);const rows=[];DATA.groups.forEach(g=>g.children.filter(c=>c.absences>=3).forEach(c=>rows.push({c,g})));rows.sort((a,b)=>b.c.absences-a.c.absences||a.c.name.localeCompare(b.c.name,"es"));const found=rows.filter(x=>!q||norm(x.c.name+" "+x.c.tutor+" "+x.g.catechist+" "+x.g.stage).includes(q));$("kids").innerHTML=found.length?found.map((x,i)=>kidCard(x.c,x.g,i+1,true)).join(""):'<div class="box empty">No hay niños con 3 o más faltas.</div>'}
function printIndividual(sheet,code,name){const g=DATA.groups.find(x=>x.sheet===sheet),c=g.children.find(x=>(code&&x.code===code)||x.name===name),w=window.open("","_blank","width=800,height=900");if(!w)return alert("Permite las ventanas emergentes para crear el reporte.");const dates=DATA.massDates.map(d=>`<tr><td>${d}</td><td>${c.dates.some(x=>x.date===d&&(x.type==="weekend"||x.type==="solemn"))?"ASISTIÓ":"FALTA"}</td></tr>`).join("");w.document.write(`<!doctype html><html><head><title>Reporte ${esc(c.name)}</title><style>body{font-family:Arial;padding:28px;color:#173126}h1{color:#075b36}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{border:1px solid #ccc;padding:9px;text-align:left}.bad{color:#b3261e;font-weight:bold}@media print{button{display:none}}</style></head><body><h1>Reporte individual CATEKIDS</h1><p><b>Niño:</b> ${esc(c.name)}<br><b>Grupo:</b> ${esc(g.group||g.sheet)}<br><b>Catequista:</b> ${esc(g.catechist||"")}<br><b>Tutor:</b> ${esc(c.tutor||"No registrado")}<br><b>WhatsApp:</b> ${esc(c.whatsapp||"No registrado")}<br><b>Faltas:</b> <span class="bad">${c.absences}</span></p><table><tr><th>Fecha de misa</th><th>Estado</th></tr>${dates}</table><p>Observaciones: ______________________________________________________________</p><button onclick="window.print()">Imprimir / Guardar PDF</button></body></html>`);w.document.close()}
$("back").onclick=()=>{if(state.screen==="group")showGroups(state.stage);else showCourses()};loadData();
</script></body></html>
