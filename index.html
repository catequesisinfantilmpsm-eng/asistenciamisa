<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075b36"><title>Asistencia a Misa CATEKIDS</title>
<style>
:root{--green:#075b36;--green2:#0c8250;--ink:#173126;--muted:#667a70;--line:#dce9e1;--shadow:0 12px 32px #075b361f}*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#e7f6ed,#fffaf0 48%,#eef7f1);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh}.hero{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 56px;border-radius:0 0 30px 30px}.hero-in,.page{max-width:1100px;margin:auto}.brand{display:flex;align-items:center;gap:13px}.mark{width:56px;height:56px;flex:0 0 56px;border-radius:18px;display:grid;place-items:center;background:#fff;color:var(--green);font-size:30px}h1{margin:0;font-size:clamp(23px,5vw,38px);line-height:1.05}.subtitle{margin:7px 0 0;color:#e5f8ec;font-size:14px}.page{padding:0 16px 38px;margin-top:-34px}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:var(--shadow);margin-bottom:15px}.mode{display:flex;gap:8px;margin-bottom:14px}.mode button{flex:1;border:1px solid #bcd4c5;background:#f4faf6;color:var(--green);padding:11px;border-radius:12px;font-weight:800;font-size:14px}.mode button.active{background:var(--green);color:#fff}.filters{display:grid;grid-template-columns:1fr 1fr 2fr;gap:12px}label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;color:#476357;margin:0 0 6px}select,input{width:100%;height:49px;border:1px solid #bed2c5;border-radius:13px;background:#fbfefc;padding:0 13px;font:inherit;font-size:16px}select:focus,input:focus{outline:3px solid #65c69055;border-color:var(--green2)}.legend{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.tag,.date{border-radius:999px;font-weight:750}.tag{padding:7px 10px;font-size:11px}.weekend{background:#c6efce;color:#185b28}.thursday{background:#fff0ad;color:#725a00}.solemn{background:#c8e5ff;color:#075384}.activity{background:#ffd4b8;color:#863900}.ordinary{background:#e9edeb;color:#4f5e56}.summary{display:grid;grid-template-columns:2fr 2fr 1fr;gap:10px;margin-top:14px}.stat{background:#eef8f2;border-radius:14px;padding:11px 13px;font-size:12px;font-weight:750}.stat strong{display:block;color:var(--green);font-size:15px;margin-top:2px}.loading,.notice{text-align:center;padding:34px 18px}.spinner{width:38px;height:38px;margin:0 auto 13px;border:4px solid #dbeae1;border-top-color:var(--green2);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.muted{color:var(--muted)}.error{color:#a4211c}.retry{margin-top:12px;border:0;border-radius:12px;background:var(--green);color:#fff;padding:11px 17px;font:inherit;font-weight:800}.tablebox{overflow:auto;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;min-width:720px}th{position:sticky;top:0;background:var(--green);color:#fff;text-align:left;padding:12px}td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}.dates{display:flex;gap:6px;flex-wrap:wrap}.date{white-space:nowrap;padding:6px 9px;font-size:12px}.updated{text-align:right;margin:10px 4px 0;font-size:12px;color:var(--muted)}
@media(max-width:720px){.page{padding:0 11px 28px}.panel{border-radius:19px;padding:14px}.filters{grid-template-columns:1fr 1fr}.search-field{grid-column:1/-1}.summary{grid-template-columns:1fr 1fr}.summary .stat:first-child{grid-column:1/-1}.tablebox{overflow:visible;border:0;background:transparent;box-shadow:none}table,tbody{display:block;min-width:0}thead{display:none}tr{display:block;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:11px;box-shadow:0 8px 22px #075b3617;position:relative}td{display:block;border:0;padding:0}td:nth-child(1){display:none}td:nth-child(2){font-size:17px;margin-bottom:8px;padding-right:48px}td:nth-child(2) small{display:block;color:var(--muted);font-size:12px;margin-top:3px}td:nth-child(3){display:inline-block;background:#eff7f2;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:750;margin-bottom:10px}td:nth-child(4){position:absolute;right:14px;top:14px;background:var(--green);color:#fff;min-width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:850}td:nth-child(5){padding-top:3px}.date{font-size:11px;padding:6px 8px}.empty{padding:24px!important;text-align:center}.updated{text-align:center}}
@media(max-width:390px){.filters,.summary{grid-template-columns:1fr}.search-field,.summary .stat:first-child{grid-column:auto}}
.mode button.alert-active{background:#a4211c;color:#fff;border-color:#a4211c}.wa{display:inline-block;background:#1f9d55;color:#fff;text-decoration:none;border-radius:10px;padding:9px 12px;font-weight:800;font-size:13px}.absence{color:#a4211c;font-weight:850}
</style></head><body>
<header class="hero"><div class="hero-in"><div class="brand"><div class="mark">✝</div><div><h1>Asistencia a Misa CATEKIDS</h1><p class="subtitle">Ciclo 2026–2027 · consulta en línea</p></div></div></div></header>
<main class="page"><section id="loading" class="panel loading"><div class="spinner"></div><strong>Cargando asistencias…</strong><div class="muted">Un momento, por favor.</div></section><section id="errorView" class="panel notice" hidden><strong class="error" id="errorText"></strong><br><button class="retry" id="retryBtn">Volver a intentar</button></section>
<section id="appView" hidden><div class="panel"><div class="mode"><button id="groupMode" class="active">Consultar grupo</button><button id="childMode">Buscar niño</button><button id="absenceMode">3 o más faltas</button></div><div class="filters"><div><label for="stage">Etapa</label><select id="stage"></select></div><div><label for="group">Grupo</label><select id="group"></select></div><div class="search-field"><label for="search">Nombre, código o tutor</label><input id="search" type="search" inputmode="search" placeholder="Escribe para buscar" disabled></div></div><div class="legend"><span class="tag weekend">Sábado / domingo</span><span class="tag thursday">Jueves</span><span class="tag solemn">Misa solemne</span><span class="tag activity">Actividad CATEKIDS</span></div><div class="summary"><div class="stat">Grupo<strong id="groupName"></strong></div><div class="stat">Catequista<strong id="cateName"></strong></div><div class="stat">Mostrando<strong id="count"></strong></div></div></div>
<div class="tablebox"><table><thead><tr><th>No.</th><th>Nombre</th><th id="head3">Grupo</th><th id="head4">Total</th><th id="head5">Fechas de asistencia</th></tr></thead><tbody id="tbody"></tbody></table></div><p id="updated" class="updated"></p></section></main>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbxju4kbW5fETufyHbpt_3PGL6alhP3llF2M1qo1a4Xg9vIaP4PyNy-6R0f1GKFG-F_b/exec";let data=null,mode="group";const $=id=>document.getElementById(id);
function jsonp(){return new Promise((resolve,reject)=>{if(API_URL.startsWith("PEGAR_"))return reject(new Error("Falta colocar la URL de Apps Script en index.html."));const cb="catekids_"+Date.now()+"_"+Math.random().toString(36).slice(2),s=document.createElement("script"),timer=setTimeout(()=>done(new Error("La conexión está tardando. Revisa que Apps Script esté publicado para cualquier persona.")),30000);function done(err,val){clearTimeout(timer);delete window[cb];s.remove();err?reject(err):resolve(val)}window[cb]=v=>done(null,v);s.onerror=()=>done(new Error("No se pudo conectar con Apps Script."));s.src=API_URL+"?"+new URLSearchParams({callback:cb,t:Date.now()});document.body.appendChild(s)})}
async function load(){$("loading").hidden=false;$("errorView").hidden=true;$("appView").hidden=true;try{const res=await jsonp();if(!res.ok)throw new Error(res.error||"No se pudieron leer los datos.");data=res;setup();$("loading").hidden=true;$("appView").hidden=false}catch(e){$("loading").hidden=true;$("errorText").textContent=e.message;$("errorView").hidden=false}}
function setup(){const stages=[...new Set(data.groups.map(g=>g.stage))];$("stage").innerHTML=stages.map(x=>`<option>${esc(x)}</option>`).join("");$("stage").onchange=fillGroups;$("group").onchange=render;$("search").oninput=render;$("groupMode").onclick=()=>setMode("group");$("childMode").onclick=()=>setMode("child");$("absenceMode").onclick=()=>setMode("absence");fillGroups();$("updated").textContent="Última actualización: "+data.updated}
function setMode(next){mode=next;$("groupMode").className=next==="group"?"active":"";$("childMode").className=next==="child"?"active":"";$("absenceMode").className=next==="absence"?"alert-active":"";$("search").disabled=next==="group";if(next==="group")$("search").value="";else $("search").focus();render()}
function fillGroups(){const gs=data.groups.filter(g=>g.stage===$("stage").value);$("group").innerHTML=gs.map(g=>`<option value="${esc(g.sheet)}">${esc(g.sheet)}</option>`).join("");render()}
function render(){const g=data.groups.find(x=>x.sheet===$("group").value);if(!g)return;const q=mode!=="group"?norm($("search").value):"";let kids=g.children.filter(c=>!q||norm(c.name+" "+c.code+" "+c.tutor).includes(q));if(mode==="absence")kids=kids.filter(c=>Number(c.absences)>=3).sort((a,b)=>b.absences-a.absences||a.name.localeCompare(b.name,"es"));$("head3").textContent=mode==="absence"?"Tutor":"Grupo";$("head4").textContent=mode==="absence"?"Faltas":"Total";$("head5").textContent=mode==="absence"?"Contacto":"Fechas de asistencia";$("groupName").textContent=(g.group||g.sheet)+" · "+g.stage;$("cateName").textContent=g.catechist||"Sin asignar";$("count").textContent=kids.length+" de "+g.children.length;$("tbody").innerHTML=kids.length?kids.map((c,i)=>mode==="absence"?absenceRow(c,i,g):attendanceRow(c,i,g)).join(""):`<tr><td class="empty" colspan="5">${mode==="absence"?"No hay niños con 3 o más faltas en este grupo.":"No se encontraron catequizandos."}</td></tr>`}
function attendanceRow(c,i,g){return `<tr><td>${i+1}</td><td><strong>${esc(c.name)}</strong><small>${esc(c.code||"Sin código")}</small></td><td>${esc(g.group||g.sheet)}</td><td>${c.dates.length}</td><td><div class="dates">${c.dates.map(d=>`<span class="date ${d.type}">${esc(d.date)}</span>`).join("")||'<span class="muted">Sin asistencia registrada</span>'}</div></td></tr>`}
function absenceRow(c,i,g){const message=`Hola, ${c.tutor||"familia"}. Somos de CATEKIDS de la Misión Parroquial El Señor de la Misericordia. Queremos acompañarles porque ${c.name} registra ${c.absences} inasistencias a Misa. ¿Podrían comunicarnos si existe alguna situación en la que podamos apoyarles? Dios les bendiga.`;const button=c.whatsapp?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${esc(c.whatsapp)}?text=${encodeURIComponent(message)}">Contactar por WhatsApp</a>`:'<span class="muted">Sin WhatsApp registrado</span>';return `<tr><td>${i+1}</td><td><strong>${esc(c.name)}</strong><small>${esc(c.code||"Sin código")}</small></td><td>${esc(c.tutor||"Tutor no registrado")}</td><td><span class="absence">${c.absences} faltas</span></td><td>${button}</td></tr>`}
function norm(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim()}function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}$("retryBtn").onclick=load;load();
</script></body></html>
